# Release every push to main that changes the app: build the package, tag it, and publish it with the
# manifest the Homebrew Channel reads. The launcher's own updater (src/js/updater.js) installs from
# these releases, so a merge to main reaches the TV without anyone tagging anything.
#
# The version: the patch number after the newest v* tag (1.4.8 -> 1.4.9). To move the minor or major
# number, raise "version" in src/appinfo.json above the newest tag and that version is used instead.
# The computed version is written into this build only (appinfo.json and APP_RELEASE in about.js),
# never committed back, so main is never pushed to by CI; the tags are the record of what shipped.
#
# Why the build is automated rather than done by hand: the manifest carries the package's SHA-256 and
# its exact byte size. Both describe one specific .ipk, so a manifest written by hand goes stale the
# moment the package is rebuilt, and the Homebrew Channel then refuses the download.

name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"      # docs, tests and tooling alone do not make a release
  workflow_dispatch:

permissions:
  contents: write

# two quick merges must not both read the same newest tag and race for the same version
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_ID: io.github.axellaffite.openhome    # the installed package id: changing it orphans every existing install

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # every tag, to find the newest and to write the notes since it

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check every script parses, and run the tests
        # A file that does not parse would install happily and leave a blank home screen, which is
        # recoverable only over SSH - and with the updater, it would reach every TV on its own.
        run: |
          python3 -c "import json;json.load(open('src/appinfo.json'))"
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test test/

      - name: Pick the version
        id: version
        run: |
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          LAST=${LAST#v}
          SOURCE=$(python3 -c "import json;print(json.load(open('src/appinfo.json'))['version'])")
          VERSION=$(python3 - "$LAST" "$SOURCE" <<'EOF'
          import sys
          last, source = sys.argv[1] or "0.0.0", sys.argv[2]
          parse = lambda v: tuple(int(p) for p in v.split("."))
          if parse(source) > parse(last):
              print(source)
          else:
              major, minor, patch = parse(last)
              print(f"{major}.{minor}.{patch + 1}")
          EOF
          )
          echo "newest tag: ${LAST:-none}, appinfo.json: $SOURCE, releasing: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

      - name: Write the version into this build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os, re
          version = os.environ["VERSION"]
          def stamp(path, pattern, replacement):
              text = open(path).read()
              new, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"{path}: version not found")
              open(path, "w").write(new)
          stamp("src/appinfo.json", r'"version":\s*"[^"]*"', f'"version": "{version}"')
          stamp("src/js/about.js", r'const APP_RELEASE="[^"]*"', f'const APP_RELEASE="{version}"')
          EOF
          grep -n '"version"' src/appinfo.json
          grep -n 'const APP_RELEASE' src/js/about.js

      - name: Build the package
        run: |
          npm install -g @webos-tools/cli
          mkdir -p dist
          ares-package src -o dist --no-minify
          ls -l dist

      - name: Install the manifest generator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Through gh, with the job's token: an anonymous call to the GitHub API shares the
          # runners' rate limit, and the 1.4.11 run got a rate-limit reply instead of the release.
          # The asset is matched by name rather than a hard-coded version, which would quietly 404
          # the day they publish a new one.
          gh release download -R webosbrew/dev-toolbox-cli -p '*gen-manifest*_amd64.deb' -O gen-manifest.deb
          sudo dpkg -i gen-manifest.deb
          # The package installs /usr/bin/webosbrew-gen-manifest - note the name is NOT the
          # webosbrew-toolbox-gen-manifest the published guide calls it.
          command -v webosbrew-gen-manifest

      - name: Write the manifest
        run: |
          IPK=$(ls dist/*.ipk)
          webosbrew-gen-manifest \
            --pkgfile "$IPK" \
            --icon "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/src/largeIcon.png" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            --root optional \
            --output "dist/${APP_ID}.manifest.json"
          cat "dist/${APP_ID}.manifest.json"

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          LAST: ${{ steps.version.outputs.last }}
        run: |
          # the notes are the commit titles since the previous release (Conventional Commits, see AGENTS.md)
          RANGE=HEAD
          if [ -n "$LAST" ]; then RANGE="v${LAST}..HEAD"; fi
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "$RANGE"
          } > notes.md
          cat notes.md
          # --target makes GitHub create the tag on this exact commit
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "OpenHome ${VERSION}" \
            --notes-file notes.md \
            dist/*.ipk "dist/${APP_ID}.manifest.json"
